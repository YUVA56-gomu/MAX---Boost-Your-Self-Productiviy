<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="MAX Brand Mark" role="img">
  <defs>
    <mask id="maxLogoApertureMask">
      <rect x="0" y="0" width="100" height="100" fill="#FFFFFF" />
      <circle cx="50" cy="50" r="11" fill="#000000" />
    </mask>
    <linearGradient id="maxLobeTop" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stopColor="#FF2E93" />
      <stop offset="100%" stopColor="#D946EF" />
